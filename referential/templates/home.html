    <style>
      body {
        background: #f5f8ff;
        font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      }
      .hero-card {
        background: linear-gradient(135deg, #132b50 0%, #1f4da3 100%);
        color: #fff;
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 18px 40px rgba(17, 36, 61, 0.16);
      }
      .hero-card .eyebrow {
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.8;
      }
      .panel-card {
        background: rgba(255,255,255,0.96);
        border: 1px solid rgba(17, 36, 61, 0.08);
        border-radius: 20px;
        box-shadow: 0 12px 30px rgba(17, 36, 61, 0.06);
      }
      .metric-card {
        padding: 16px 18px;
        border-radius: 16px;
        background: #f8fbff;
        border: 1px solid rgba(17, 36, 61, 0.06);
      }
      .metric-card .value {
        font-size: 28px;
        font-weight: 700;
        margin-top: 4px;
      }
      .score-chip {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        background: #ebf9f1;
        color: #1f7a3b;
        padding: 6px 10px;
        font-weight: 600;
      }
      .filter-card {
        padding: 20px;
      }
      .table thead th {
        color: #5c6b7a;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
      }
    </style>
    
    
    
    
	<style>table.dataTable thead .sorting:after,

table.dataTable thead .sorting_desc:before,

table.dataTable thead .sorting_desc_disabled:before {
bottom: .5em;
}
</style>
